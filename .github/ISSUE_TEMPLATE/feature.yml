name: Feature request
description: A figure, check, option or output you wish existed
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: What you are trying to do and why the current options do not cover it.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the output or API would look like
      description: A sketch of the figure, option or command line is enough. Say if you want to build it.
