name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A Dependabot auto-merge pushes with GITHUB_TOKEN, which starts no workflow, so main can sit
  # on commits CI never ran and the release script waits for a run that never comes. The nightly
  # run checks main within a day of any bot merge; workflow_dispatch lets a person start one now.
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
  package:
    # The tarball people install, checked before a tag exists: files, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx publint --strict
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, package, release-gate]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success
