name: release
on:
  push:
    tags: ["v*.*.*"] # release tags only; the moving major tag (v0) must not start a publish
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # a release builds from a clean install; nothing cached can reach it
      - name: The tag must name the version in package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package.json version $v; run npm run release instead of tagging by hand"; exit 1; fi
        env:
          TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --access public
      - name: Release notes are the CHANGELOG entry, then the generated list of pull requests
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$TAG" --verify-tag --generate-notes --notes-file notes.md
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  smoke:
    # The published package, installed from the registry on three operating systems, reports the released version.
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: npx the released version from the registry
        shell: bash
        run: |
          # This step is the only proof that what was published installs and runs, and until
          # 2026-09-12 it could not fail. The old check searched the output for the version
          # string anywhere, and npm's own failure text quotes it back:
          #
          #   npm error notarget No matching version found for ai-slop-linter@0.1.5.
          #
          # So six exhausted retries against a registry that was still processing the publish
          # printed "smoke ok" and the job went green. Installing is now tracked separately from
          # what was printed, and the printed version must equal the released one exactly.
          v="${TAG#v}"
          installed=""
          for i in 1 2 3 4 5 6; do
            if out=$(npx --yes "$PKG@$v" --version 2>&1); then installed=yes; break; fi
            echo "attempt $i did not install:"; echo "$out"; sleep 20
          done
          if [ -z "$installed" ]; then
            echo "the registry never served $PKG@$v: six attempts over two minutes all failed"
            exit 1
          fi
          echo "$out"
          printed=$(printf '%s' "$out" | tr -d '\r' | tail -n 1 | tr -d '[:space:]')
          if [ "$printed" != "$v" ]; then
            echo "installed, but --version printed '$printed' where $v was expected"
            exit 1
          fi
          echo "smoke ok: $PKG@$v"
        env:
          TAG: ${{ github.ref_name }}
          PKG: ${{ github.event.repository.name }}
